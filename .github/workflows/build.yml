name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # only used by the release step on tags

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Tags must be vX.Y.Z: an MSI version has no room for a suffix. Other builds keep the
      # project's version; the label only names the uploaded artifact.
      - name: Version
        id: version
        shell: pwsh
        run: |
          $base = ([xml](Get-Content AIAnnounce.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1); $label = $v }
          else { $v = $base; $label = "$base-ci.$env:GITHUB_RUN_NUMBER" }
          "value=$v" >> $env:GITHUB_OUTPUT
          "label=$label" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v, files labeled $label"

      - name: Regression checks
        run: dotnet run --project tests/AIAnnounce.Tests.csproj -c Release

      - name: Build installer and portable zips
        shell: pwsh
        run: ./build.ps1 -Release -Version ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: AIAnnounce-${{ steps.version.outputs.label }}
          path: |
            artifacts/*.msi
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      # File names stay the same from release to release, so the README's
      # releases/latest/download links always fetch the newest build.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AI Announce ${{ steps.version.outputs.value }}
          body: |
            ### Install

            1. Download **AIAnnounce-win-x64.msi** below and run it.
            2. It installs for your Windows account only, with no admin prompt, adds AI Announce to the Start menu, and starts the overlay. A newer MSI upgrades it in place; uninstall from Settings → Apps.
            3. If Windows says it protected your PC, click **More info → Run anyway**. The installer isn't code-signed yet.

            Rather not install? **AIAnnounce-win-x64-self-contained.zip** is the same program as a portable exe, no .NET needed. **AIAnnounce-win-x64-framework-dependent.zip** is much smaller and needs the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) or newer. **SHA256SUMS.txt** has checksums for all three.

            Needs Windows 10 or 11 and at least one of the CLIs it watches: Claude Code, Codex or agy.
          files: |
            artifacts/*.msi
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
